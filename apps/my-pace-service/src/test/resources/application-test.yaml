spring:
  application:
    name: my-pace-service-test
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jwt:
    secret: test-jwt-secret-with-at-least-256-bits-length-so-it-does-not-fail-validation
    access-token-expiration: 86400
    refresh-token-expiration: 604800
  resend:
    api-key: test-resend-key
    from: test@example.com

app:
  cors:
    allowed-origins: http://localhost:3000
