spring:
  application:
    name: my-pace-service-test
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  jwt:
    secret: test-jwt-secret-with-at-least-256-bits-length-so-it-does-not-fail-validation
    access-token-expiration: 86400
    refresh-token-expiration: 604800
  resend:
    api-key: test-resend-key
    from: test@example.com

app:
  cors:
    allowed-origins: http://localhost:3000
