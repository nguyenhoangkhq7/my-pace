spring:
  application:
    name: my-pace-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/my_pace_db}
    username: ${SPRING_DATASOURCE_USERNAME:my_pace}
    password: ${SPRING_DATASOURCE_PASSWORD:my_pace_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 86400 # 24 hours in seconds
    refresh-token-expiration: 604800 # 7 days in seconds
  resend:
    api-key: ${RESEND_API_KEY}
    from: ${RESEND_FROM_EMAIL:onboarding@resend.dev}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:false}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://my-pace-h27b.vercel.app,https://hoangkhaq.site,https://www.hoangkhaq.site}

