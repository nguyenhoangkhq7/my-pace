spring:
  application:
    name: my-pace-service
  datasource:
    url: jdbc:mysql://localhost:3306/my_pace_db
    username: root
    password: 22718451
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 3600 # 1 hour in seconds
    refresh-token-expiration: 604800 # 7 days in seconds
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  data:
    redis:
      host: localhost
      port: 6379
