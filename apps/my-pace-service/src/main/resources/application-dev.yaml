spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/my_pace_db}
    username: ${SPRING_DATASOURCE_USERNAME:my_pace}
    password: ${SPRING_DATASOURCE_PASSWORD:my_pace_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  groq:
    api-key: ${GROQ_API_KEY}
    model: ${GROQ_MODEL:qwen/qwen3.6-27b}
