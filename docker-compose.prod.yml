services:
  db:
    image: postgres:17-alpine
    container_name: my-pace-db-prod
    env_file:
      - ./apps/my-pace-service/.env
    ports:
      - "5432:5432"
    volumes:
      - db_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U my_pace -d my_pace_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${BACKEND_IMAGE:-my-pace-api:latest}
    container_name: my-pace-api-prod
    env_file:
      - ./apps/my-pace-service/.env
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data_prod:
