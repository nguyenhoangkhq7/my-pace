name: Backend CD (Main Only)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/my-pace-service/**'
      - '.github/workflows/backend-cd.yml'

permissions:
  contents: write # Để tạo tự động Git Tag

env:
  DOCKER_REPOSITORY: ${{ secrets.DOCKER_USERNAME }}/mypace-backend

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/my-pace-service
        
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Để có thể push Git Tag
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          
      - name: Create .env file from Secrets
        run: |
          echo "${{ secrets.BACKEND_ENV }}" > .env
          
      - name: Build with Maven
        run: ./mvnw clean package -DskipTests
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        
      - name: Generate Tag
        id: vars
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          echo "TAG=prod-$VERSION" >> $GITHUB_ENV
          
      - name: Build, tag, and push image to Docker Hub
        id: build-image
        env:
          IMAGE_TAG: ${{ env.TAG }}
        run: |
          docker build -t ${{ env.DOCKER_REPOSITORY }}:$IMAGE_TAG .
          docker push ${{ env.DOCKER_REPOSITORY }}:$IMAGE_TAG
          echo "IMAGE_URI=${{ env.DOCKER_REPOSITORY }}:$IMAGE_TAG" >> $GITHUB_ENV
          
      - name: Scan Docker Image for Vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_URI }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          
      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ env.TAG }}
          git push origin ${{ env.TAG }}
          
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            
            PROJECT_DIR="/home/ubuntu/my-pace-app"
            IMAGE_URI="${{ env.IMAGE_URI }}"
            
            # 1. Đăng nhập Docker Hub
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login --username ${{ secrets.DOCKER_USERNAME }} --password-stdin
            
            # 2. Tạo hoặc ghi đè file .env cho service Backend
            mkdir -p $PROJECT_DIR/apps/my-pace-service
            cat << 'EOF' > $PROJECT_DIR/apps/my-pace-service/.env
            ${{ secrets.BACKEND_ENV }}
            EOF
            
            # 3. Ghi biến môi trường cho Docker Compose ở Root
            mkdir -p $PROJECT_DIR
            touch $PROJECT_DIR/.env
            sed -i '/^BACKEND_IMAGE=/d' $PROJECT_DIR/.env
            echo "BACKEND_IMAGE=$IMAGE_URI" >> $PROJECT_DIR/.env
            
            # 4. Pull Image mới nhất và khởi động lại Backend
            cd $PROJECT_DIR
            docker pull $IMAGE_URI
            docker compose up -d --no-deps my-pace-service
